<footer class="site-footer" data-section="Site footer">
  <div class="site-footer__wrap">
    <div class="site-footer__brand">
      <a class="site-footer__logo" href="{{root}}">
        <picture>
          <source srcset="{{root}}{{site:brand.logoFullWebp}}" type="image/webp">
          <img class="site-footer__logo-image" src="{{root}}{{site:brand.logoFullPng}}" width="{{site:brand.logoFullWidth}}" height="{{site:brand.logoFullHeight}}" alt="{{site:brand.name}}: {{site:brand.tagline}}. Home" loading="lazy">
        </picture>
      </a>
      <p class="site-footer__description">{{site:brand.description}}</p>
      <p class="site-footer__location"><svg class="site-footer__location-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>{{site:contact.location}}</p>
      <a class="site-footer__email" href="mailto:{{site:contact.email}}">{{site:contact.email}}</a>
    </div>
    <div class="site-footer__columns">
      {{footer-columns}}
    </div>
    <div class="site-footer__legal">
      {{footer-legal}}
    </div>
  </div>
</footer>
